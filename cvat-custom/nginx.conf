# =============================================================================
# CVAT nginx 配置（平台集成定制版）
#
# 基于上游 cvat/nginx.conf，仅做以下改动，以便平台页面能以 iframe 嵌入 CVAT：
#   1. 删除 X-Frame-Options 兜底 map 块（原 `map $upstream_http_x_frame_options ...`）；
#   2. 用 Content-Security-Policy: frame-ancestors 取代
#      `add_header X-Frame-Options $hdr_x_frame_options always;`。
#
# 其余内容与上游逐字节一致（listen 8080、server_tokens off、各 location 块等）。
#
# ⚠️ 生产部署时请把下方 CSP 里的 http://localhost:5173 替换为实际平台域名，
#    例如 https://platform.example.com 。nginx 不会替换 add_header 值里的 ${...}，
#    因此这里写死占位值，运维替换时一眼可见。
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
  worker_connections 512;
}

error_log /dev/stderr;

http {

  ##
  # Basic Settings
  ##

  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  ##
  # Override default tmp paths to run nginx from non-root user
  ##

  proxy_temp_path    /tmp/nginx_proxy;
  uwsgi_temp_path    /tmp/nginx_uwsgi;
  scgi_temp_path     /tmp/nginx_scgi;
  fastcgi_temp_path  /tmp/nginx_fastcgi;
  client_body_temp_path /tmp/nginx_body;

  ##
  # Logging Settings
  ##

  access_log /dev/stdout;

  ##
  # CVAT Settings
  ##

  # Only add security headers if the upstream server does not already provide them.
  map $upstream_http_referrer_policy $hdr_referrer_policy {
      '' "strict-origin-when-cross-origin";
  }

  map $upstream_http_x_content_type_options $hdr_x_content_type_options {
      '' "nosniff";
  }

  server {
    listen 8080;
    # previously used value
    client_max_body_size 1G;

    add_header Referrer-Policy $hdr_referrer_policy always;
    add_header X-Content-Type-Options $hdr_x_content_type_options always;
    # 允许平台页面以 iframe 嵌入 CVAT。用 CSP frame-ancestors 精确控制来源，
    # 不再发送 X-Frame-Options（该头无法表达第三方来源，ALLOW-FROM 已废弃）。
    # 生产部署时把 http://localhost:5173 替换为实际平台域名，例如 https://platform.example.com
    add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:5173" always;

    server_name _;

    # Disable server signature to make it slightly harder for
    # attackers to find known vulnerabilities. See
    # https://datatracker.ietf.org/doc/html/rfc9110#name-server
    server_tokens off;

    location /static/ {
      gzip on;
      gzip_comp_level 6;
      gzip_http_version 1.1;
      gzip_types
          application/javascript
          application/x-javascript
          text/javascript
          application/wasm
          image/x-icon;

      alias /home/django/static/;
    }

    location /data/ {
      internal;
      alias /home/django/data/;
    }

    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      proxy_buffering on;
      proxy_buffers 16 8k;
      proxy_temp_path /tmp/nginx 1 2;
      proxy_pass http://uvicorn;
    }
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream uvicorn {
    server unix:/tmp/cvat/uvicorn.sock;
  }
}
