server {
    root /usr/share/nginx/html;

    # Disable server signature to make it slightly harder for
    # attackers to find known vulnerabilities. See
    # https://datatracker.ietf.org/doc/html/rfc9110#name-server
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_types
        text/html
        application/javascript
        application/x-javascript
        text/javascript
        application/wasm
        image/x-icon;

    location / {
        # 仅在 iframe 嵌入时隐藏 CVAT 顶部导航（Logo / Tasks / Projects / Jobs / 用户菜单）。
        # 直接打开 CVAT 时 window.self === window.top，菜单保留。
        # 跨域父页面无法操作 iframe DOM，因此在 UI 的 index.html 里注入外部样式/脚本。
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/cvat-embedded/cvat-embedded.css"><script src="/cvat-embedded/cvat-embedded.js"></script></head>';

        # Any route that doesn't exist on the server (e.g. /devices)
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Embedder-Policy "credentialless";
        add_header Expires 0;
        # 允许平台页面以 iframe 嵌入 CVAT UI（取代上游的 X-Frame-Options: deny）。
        # 生产部署时把 http://localhost:3000 替换为实际平台域名。
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:3000" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /cvat-embedded/ {
        alias /etc/nginx/cvat-embedded/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    location ~ \.map$ {
        return 404;
        access_log off;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Service-Worker-Allowed "/" always;

        include /etc/nginx/mime.types;
        types {
            # mjs modules must have application/javascript, not default application/octet-stream
            application/javascript mjs;
        }

        access_log off;
    }
}
